[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cognitive-firm"
version = "0.1.0"
description = "A governance kernel for organizations that coordinate persistent human and agent roles."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Daniel Alami" }]
keywords = ["agents", "governance", "orchestration", "m-form", "multi-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anthropic>=0.25.0",
    "google-genai>=1.0.0",
    "openai>=1.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "requests>=2.31",
    "tenacity>=8.2",
    "click>=8.1",
    "rich>=13.7",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
substrate = [
    "scipy>=1.11",
    "sympy>=1.12",
    "numpy>=1.26",
    "networkx>=3.2",
    "pandas>=2.1",
    "matplotlib>=3.8",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "hypothesis>=6.100",
    "ruff>=0.1",
    "mypy>=1.7",
]

[project.urls]
Homepage = "https://github.com/sparckix/cognitive-firm"
Source = "https://github.com/sparckix/cognitive-firm"

[project.scripts]
cognitive-firm-kernel-service = "cognitive_firm.kernel_service:main"
cognitive-firm-actor-membership = "cognitive_firm.orchestration.actor_membership:main"
cognitive-firm-identity-provisioning = "cognitive_firm.identity_provisioning:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cognitive_firm*"]

[tool.setuptools.package-data]
cognitive_firm = ["py.typed"]

[tool.ruff]
line-length = 110
target-version = "py311"
