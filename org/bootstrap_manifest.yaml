# Agent bootstrap manifest — schema_version 1
#
# This file lists the files an agent MUST read on cold start, in order, plus
# files to consult on demand. It is loaded by `scripts/agent_daemon.py` and
# interpolated into the daemon prompt, so adding a 7th required-read file is
# now a YAML edit rather than a Python source edit.
#
# Verified by `scripts/org_role_preflight.py` — all `required_reads` paths
# must exist or preflight fails loud.
#
# Audience: adopters running role daemons from this checkout or an overlay.

schema_version: 1
last_updated: "2026-04-30"

# ── Required reads ───────────────────────────────────────────────────
#
# Every role daemon prompt instructs the agent to read these in order on
# the first action of every tick. Path is repo-relative; substitution
# variables: {role_id}.

required_reads:
  - path: "AGENTS.md"
    purpose: "Repository-level constitution. Read §0–§5b first (MUST-READ subset, ~150 lines); later sections on demand."
    must_read_subset_sections: ["0", "0a", "0b", "1", "4a", "4b", "5b"]

  - path: "org/roles/{role_id}.yaml"
    purpose: "Durable role contract: authorized_paths, forbidden_paths, delegates_to, escalates_to, budget, sla."
    schema: "schemas/role.v1.schema.json"

  - path: "org/mandates/{role_id}_mandate.md"
    purpose: "Role scope + authorization. Authoritative for what the role does autonomously vs requires escalation."
    optional_for_roles: ["engineer", "reviewer"]   # 2026-04-30: minimal mandates shipped; if absent, escalate ambiguous decisions to manager
    fallback_when_absent: "If absent, agent escalates any ambiguous decision to role.manager and treats role yaml as the only authorization contract."

  - path: "org/preferences/principal.yaml"
    purpose: "Principal's research-taste routing preferences. Versioned; read each tick because principal may have edited."

  - path: "analytics/RD_TICK_BRIEF.md"
    only_for_roles: ["research_director"]
    purpose: "Auto-regenerated generic tick brief. Produced by `scripts/rd_tick_brief.py` via `pre_tick_scripts` below. Read at the start of every research_director tick."
    optional_for_roles: ["manager", "engineer", "reviewer", "research_scientist", "skeptic", "product_manager"]
    fallback_when_absent: "If absent, the role is not research_director or the pre_tick_scripts hook didn't fire; agents in non-RD roles ignore."

# ── Pre-tick scripts ─────────────────────────────────────────────────
#
# Scripts run BEFORE required_reads are formatted. Output (stdout) is
# written to `output_to`; `required_reads` then references the output
# path normally (so the agent reads the regenerated brief). Scoped via
# `only_for_roles` so e.g. RD-tick-brief runs only for research_director
# tick, not for manager / engineer / reviewer ticks.
#
# `failure_action`:
#   - "block": exit code != 0 aborts the tick.
#   - "warn":  exit code != 0 is logged but the tick proceeds (default).
#   - "ignore": exit code never blocks.
#
# Implementation: `scripts/agent_daemon.py::_format_bootstrap_chain`
# checks for `pre_tick_scripts`, filters by role_id, runs them, captures
# stdout, writes to `output_to`, then proceeds to format required_reads.

pre_tick_scripts:
  - script: "scripts/rd_tick_brief.py"
    only_for_roles: ["research_director"]
    output_to: "analytics/RD_TICK_BRIEF.md"
    args: ["--short"]
    failure_action: "warn"
    purpose: "Surface role scope, recent workspace state, and optional forecast/action-impact summaries before each research_director tick."

# ── Conditional reads ────────────────────────────────────────────────
#
# Read when the agent's task references the topic. Not required on every
# tick — referenced from the bootstrap prompt's IMPORTANT block.

conditional_reads:
  - path: "docs/protocols/kernel-service.md"
    purpose: "Read before wiring app surfaces or scripts to typed kernel mutations."

  - path: "docs/protocols/actor-membership.md"
    purpose: "Read before changing actor, role, tenant, or project authority."

  - path: "docs/protocols/a2h.md"
    purpose: "Read when designing agent-to-human work requests or handoff paths."

  - path: "docs/protocols/h2a.md"
    purpose: "Read when designing human-to-agent instruction and attestation paths."

  - path: "docs/protocols/forecast-market.md"
    purpose: "Read when consuming or adapting forecast-market summaries."

  - path: "docs/protocols/action-impact.md"
    purpose: "Read when consuming or adapting measured action-impact summaries."

# ── Conflict resolution priority ─────────────────────────────────────
#
# When two sources disagree, the higher-priority source wins. Listed
# top-down, stricter-wins-on-ties.

conflict_resolution_priority:
  - "role yaml `forbidden_paths` (typed hard veto)"
  - "AGENTS.md §0–§5b (controlling constitutional rules)"
  - "role mandate (prose scope contract)"
  - "AGENTS.md §6+ (reference sections)"
  - "principal preferences (routing/taste)"
  - "task description (subject matter, NOT scope override)"

# ── Cost budget hint ─────────────────────────────────────────────────
#
# Agents under cost pressure may read only the MUST-READ subset of AGENTS.md
# plus the role yaml + mandate + preferences. Conditional reads happen only
# when the task explicitly references them. At 600s daemon interval this
# keeps per-tick chain-reload tax to ~$0.50/day per daemon (vs ~$1.50/day if
# the full 545-line AGENTS.md is re-read every tick).

cost_hint:
  must_read_chars: 15000     # AGENTS.md §0-§5b + role yaml + mandate + preferences
  on_demand_chars: 35000     # AGENTS.md §6+ + conditional reads
  default_daemon_interval_seconds: 600
